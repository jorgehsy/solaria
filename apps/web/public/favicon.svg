<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Solaria orbit badge: amber sun, blue planet on a dashed orbit (same mark as the header wordmark). -->
  <style>
    .spin { transform-origin: 16px 16px; animation: orbit 6s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
  <circle cx="16" cy="16" r="16" fill="#081325"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#e9f3ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="2.6 2.6"/>
  <circle cx="16" cy="16" r="7" fill="#ffc46b" fill-opacity="0.25"/>
  <circle cx="16" cy="16" r="4.5" fill="#ffc46b"/>
  <g class="spin">
    <circle cx="16" cy="6" r="4.8" fill="#48b4ff" fill-opacity="0.3"/>
    <circle cx="16" cy="6" r="3.5" fill="#48b4ff"/>
  </g>
</svg>
