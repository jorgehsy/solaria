<!-- PROTOTYPE, throwaway: 3 variants of error/empty states for issue #12, switch with ?variant=A|B|C and ?case=… -->
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Solaria error states (prototype)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* One deliberate dark look: the brand's navy ground, full screen, for a TV left on in the office. */
:root {
  color-scheme: dark;
  --ground-a: #14305c;
  --ground-b: #081325;
  --ground-c: #040a15;
  --ink: #f4f7fb;
  --ink-muted: #9aa8bd;
  --ink-faint: #6f7f98;
  --ice: #e9f3ff;
  --sky: #48b4ff;
  --blue: #1169f5;
  --blue-text: #6fa8ff;
  --orange: #ff8a4c;
  --gas: #ff5a4a;
  --ok: #3ddc97;
  --fail: #ff4d5e;
  --human: #ffc46b;
  --agent: #48b4ff;
  --glass: rgba(8, 19, 37, 0.72);
  --glass-line: rgba(233, 243, 255, 0.12);
  --glass-hover: rgba(233, 243, 255, 0.14);
  --focus-ring: #48b4ff;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dur-press: 120ms;
  --dur-fast: 160ms;
  --dur-base: 220ms;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --gutter-t: max(16px, env(safe-area-inset-top, 0px));
  --gutter-b: max(14px, env(safe-area-inset-bottom, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--ground-c);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 6px; }

.u {
  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(90% 70% at 70% -10%, var(--ground-a), transparent 62%),
    linear-gradient(180deg, var(--ground-b), var(--ground-c));
  touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: grab;
}
.u:active { cursor: grabbing; }
.u:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; border-radius: 0; }
.gl, .gl canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }

/* Labels over the canvas */
.lab { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity var(--dur-base) ease; }
.lab.off { opacity: 0; }
.lab-gal {
  display: flex; align-items: baseline; gap: 8px; white-space: nowrap; pointer-events: auto; text-decoration: none;
  font-size: 11px; line-height: 1.3; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue-text);
  padding: 6px 4px; transform-origin: 50% 100%;
}
.lab-gal span { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.lab-gal:hover { color: var(--sky); }
.lab-map {
  display: grid; gap: 2px; width: max-content; max-width: 184px; text-align: center; pointer-events: auto; text-decoration: none;
  padding: 2px 6px; border-radius: 8px;
  text-shadow: 0 0 6px var(--ground-c), 0 0 2px var(--ground-c), 0 0 1px var(--ground-c);
}
.lab-map b { font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--ink); letter-spacing: -0.005em; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.lab-map span { font-size: 11px; line-height: 1.3; font-weight: 500; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
@media (hover: hover) and (pointer: fine) { .lab-map:hover b { text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; } }
.lab-work {
  font-size: 11px; line-height: 1.2; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
  text-shadow: 0 0 4px var(--ground-c), 0 0 2px var(--ground-c);
}
.lab-work i { font-style: normal; font-weight: 500; color: var(--agent); }
.lab-work.human i { color: var(--human); }

.hl-arrow { position: absolute; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; display: grid; place-items: center; pointer-events: none; color: var(--ice); opacity: 0; border-radius: 9999px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line), 0 0 12px rgba(72, 180, 255, 0.45); }
.hl-arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.hit { position: absolute; left: 0; top: 0; border-radius: 9999px; cursor: pointer; -webkit-user-drag: none; }
.hit:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

/* Brand corner */
.brand { position: absolute; top: var(--gutter-t); left: var(--gutter-l); display: grid; gap: 6px; pointer-events: none; transition: opacity var(--dur-base) ease; }
.rule { width: 40px; height: 4px; border-radius: 9999px; background: var(--sky); }
.eyebrow { margin: 4px 0 0; font-size: 11px; line-height: 1.3; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue-text); }
h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
.status { pointer-events: auto; margin: 2px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; line-height: 1.4; font-weight: 500; color: var(--ink-muted); font-variant-numeric: tabular-nums; min-height: 17px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ground-c); background: var(--human); }
.status .warn { color: var(--orange); }
.fresh { display: inline-flex; align-items: center; gap: 7px; pointer-events: auto; cursor: default; }
.dot { flex: none; width: 6px; height: 6px; border-radius: 9999px; background: var(--ink-faint); }
.fresh.ok .dot { background: var(--ok); opacity: 0.7; }
.fresh.stale .dot { background: var(--human); box-shadow: 0 0 8px var(--human); }
.fresh.stale { color: var(--human); }

/* Tools */
.tools { position: absolute; top: var(--gutter-t); right: var(--gutter-r); display: flex; gap: 8px; }
.tool {
  width: 40px; height: 40px; display: grid; place-items: center; padding: 0;
  color: var(--ice); background: rgba(233, 243, 255, 0.06); border: 0; border-radius: 12px;
  box-shadow: inset 0 0 0 1px var(--glass-line); cursor: pointer;
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-fast) ease, opacity var(--dur-base) ease;
}
.tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.tool:active { transform: scale(0.97); }
.tool[aria-expanded="true"], .tool[aria-pressed="true"] { background: var(--glass-hover); color: var(--sky); }
.tool { position: relative; }
.tool[aria-pressed="false"] { color: var(--ink-faint); }
.tool[aria-pressed="true"]::after { content: ""; position: absolute; top: 7px; right: 7px; width: 5px; height: 5px; border-radius: 9999px; background: var(--sky); box-shadow: 0 0 6px var(--sky); }
@media (max-width: 420px) { .tools { gap: 6px; } .tool { width: 36px; height: 36px; } }

/* Buscador */
.search {
  position: absolute; top: calc(var(--gutter-t) + 52px); left: 50%; transform: translateX(-50%); width: min(440px, calc(100% - 32px));
  display: grid; gap: 4px; padding: 6px; border-radius: 14px; cursor: default; z-index: 4;
  background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line), 0 24px 48px -16px rgba(0, 0, 0, 0.6);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.search[hidden] { display: none; }
.search.in { animation: searchIn 180ms var(--ease-out) both; }
@keyframes searchIn { from { opacity: 0; transform: translateX(-50%) translateY(-4px) scale(0.98); } }
.search-row { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
.search-row svg { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--ink-muted); stroke-width: 1.9; stroke-linecap: round; }
.search input {
  flex: 1; min-width: 0; height: 36px; font: inherit; font-size: 16px; font-weight: 500; color: var(--ink);
  background: none; border: 0; outline: none; padding: 0;
}
.search input::placeholder { color: var(--ink-faint); }
.search ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.search ul:empty { display: none; }
.search li { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 10px; border-radius: 9px; font-size: 13px; line-height: 1.35; cursor: pointer; }
.search li[aria-selected="true"] { background: var(--glass-hover); }
.search li .ref { flex: none; color: var(--ink-muted); font-variant-numeric: tabular-nums; font-weight: 500; }
.search li .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.search li.none { cursor: default; color: var(--ink-muted); font-weight: 500; }
@media (hover: hover) and (pointer: fine) { .tool:hover { background: var(--glass-hover); } }

/* Bitácora: bottom left, quiet, fades with age */
.log {
  position: absolute; left: var(--gutter-l); bottom: var(--gutter-b); margin: 0; padding: 0; list-style: none;
  display: grid; gap: 4px; max-width: min(560px, calc(100% - 32px)); pointer-events: none;
}
.log li { display: flex; align-items: center; gap: 2px; min-width: 0; font-size: 13px; line-height: 1.45; font-weight: 500; color: var(--ink); transition: opacity 1200ms ease; }
.log-go {
  display: flex; align-items: center; gap: 8px; min-width: 0; pointer-events: auto; cursor: pointer; text-align: left;
  font: inherit; color: inherit; background: none; border: 0; padding: 2px 6px; margin: 0 0 0 -6px; border-radius: 8px;
  transition: background-color var(--dur-fast) ease;
}
.log-go .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { .log-go:hover { background: rgba(233, 243, 255, 0.06); } }
.log-ext { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-faint); pointer-events: auto; transition: color var(--dur-fast) ease, background-color var(--dur-fast) ease; }
.log-ext svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) and (pointer: fine) { .log-ext:hover { color: var(--sky); background: rgba(233, 243, 255, 0.06); } }
.log li.in { animation: logIn 420ms var(--ease-out) both; }
.log .when { flex: none; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.log .pip { flex: none; width: 6px; height: 6px; border-radius: 9999px; background: var(--ice); box-shadow: 0 0 8px currentColor; color: var(--ice); }
@keyframes logIn { from { opacity: 0; transform: translateY(6px); } }

/* Legend: bottom right, desktop only */
.legend {
  position: absolute; right: var(--gutter-r); bottom: var(--gutter-b); margin: 0; padding: 0; list-style: none;
  display: flex; flex-wrap: nowrap; justify-content: flex-end; gap: 4px 14px; pointer-events: none;
  font-size: 11px; line-height: 1.4; font-weight: 500; color: var(--ink-faint); transition: opacity var(--dur-base) ease;
}
.legend li { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.g { flex: none; width: 9px; height: 9px; display: inline-block; border-radius: 9999px; }
.g-sun { background: var(--ice); box-shadow: 0 0 0 2px var(--ground-b), 0 0 0 3.5px var(--sky), 0 0 10px var(--sky); transform: scale(0.8); }
.g-todo { box-shadow: inset 0 0 0 1.5px var(--ink-muted); }
.g-doing { background: var(--blue); box-shadow: 0 0 8px var(--sky); }
.g-blocked { background: var(--orange); border-radius: 2px; transform: rotate(45deg) scale(0.82); }
.g-review { box-shadow: inset 0 0 0 1.5px var(--blue-text); background: radial-gradient(circle, var(--blue-text) 0 2px, transparent 2.5px); }
.g-gas { width: 14px; height: 9px; background: radial-gradient(closest-side, rgba(255, 90, 74, 0.55), transparent); }
.g-sat { position: relative; box-shadow: inset 0 0 0 1.5px var(--ink-muted); }
.g-sat::after { content: ""; position: absolute; right: -4px; top: -3px; width: 4px; height: 4px; border-radius: 9999px; background: var(--agent); box-shadow: 0 0 6px var(--agent); }
@media (max-width: 1240px) { .legend { display: none; } }

/* Modo demo */
.demo {
  position: absolute; right: var(--gutter-r); bottom: calc(var(--gutter-b) + 28px); width: min(340px, calc(100% - 32px));
  display: grid; gap: 10px; padding: 14px; border-radius: 16px;
  background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line), 0 24px 48px -16px rgba(0, 0, 0, 0.6);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transform-origin: 100% 100%; cursor: default;
}
.demo[hidden] { display: none; }
.demo.in { animation: demoIn 200ms var(--ease-out) both; }
@keyframes demoIn { from { opacity: 0; transform: translateY(6px) scale(0.98); } }
.demo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.demo h2 { margin: 0; font-size: 11px; line-height: 1.3; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue-text); }
.kbd { font-size: 11px; font-weight: 600; color: var(--ink-muted); padding: 1px 6px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--glass-line); }
.demo p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--ink-muted); }
.demo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.demo-grid button {
  display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left;
  font: inherit; font-size: 13px; line-height: 1.3; font-weight: 500; color: var(--ink);
  background: rgba(233, 243, 255, 0.05); border: 0; border-radius: 10px; padding: 8px 10px; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(233, 243, 255, 0.07);
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-fast) ease;
}
.demo-grid button:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .demo-grid button:hover { background: var(--glass-hover); } }
.demo-grid .pip { flex: none; width: 6px; height: 6px; border-radius: 9999px; background: currentColor; box-shadow: 0 0 8px currentColor; }
.demo-grid span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Tooltip */
.tip {
  position: absolute; left: 0; top: 0; z-index: 3; display: grid; gap: 4px; width: max-content; max-width: min(300px, calc(100% - 24px));
  background: var(--glass); color: var(--ink); border-radius: 12px; padding: 10px 12px;
  box-shadow: inset 0 0 0 1px var(--glass-line), 0 24px 48px -16px rgba(0, 0, 0, 0.6);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  pointer-events: none; opacity: 0; visibility: hidden;
  transition: opacity 125ms var(--ease-out), visibility 0s linear 125ms;
}
.tip.on { opacity: 1; visibility: visible; transition: opacity 125ms var(--ease-out); }
.tip.touch { pointer-events: auto; cursor: default; }
.tip-ref { font-size: 12px; line-height: 1.4; font-weight: 500; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.tip-ref b { font-weight: 600; color: var(--ink); }
.tip-title { font-size: 14px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
.tip-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; font-size: 12px; line-height: 1.4; font-weight: 500; color: var(--ink-muted); }
.tip-foot .chip { display: inline-flex; align-items: center; gap: 6px; }
.tip a { font-size: 12px; font-weight: 600; color: var(--sky); text-decoration: none; padding: 6px 0; margin: -6px 0; }

/* Notice: no WebGL, or the connector needs something */
.notice {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100% - 32px));
  display: grid; gap: 12px; justify-items: start; padding: 24px; border-radius: 16px; cursor: default;
  background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.notice[hidden] { display: none; }
.notice h2 { margin: 0; font-size: 18px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; }
.notice p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-muted); }
.btn {
  font: inherit; font-size: 14px; line-height: 1.3; font-weight: 600; color: #ffffff; background: var(--blue);
  border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; transition: transform var(--dur-press) var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Clean mode: the CSS fallback for fullscreen hides the chrome and leaves the universe */
.u.is-clean .brand, .u.is-clean .legend, .u.demo-open .legend { opacity: 0; }
.u.is-clean .tools .tool:not(#tFs) { opacity: 0.25; }

@media (max-width: 600px) {
  h1 { font-size: 22px; }
  .log li { font-size: 12px; }
  .log li:nth-last-child(n+4) { display: none; }
  .demo { left: var(--gutter-l); right: var(--gutter-r); width: auto; bottom: var(--gutter-b); }
}
@media (prefers-reduced-motion: reduce) {
  .log li.in, .demo.in, .search.in { animation: none; }
  .tool:active, .btn:active, .demo-grid button:active { transform: none; }
  .lab, .tip { transition: none; }
}

/* ===== PROTOTYPE chrome and variants (not part of the design) ===== */
.proto-pill { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 100; display: grid; gap: 4px; justify-items: center; max-width: calc(100% - 16px);
  background: #fff; color: #000; border-radius: 14px; padding: 7px 12px; box-shadow: 0 0 0 3px #ffe14d, 0 8px 28px rgba(0,0,0,.6); font: 12px/1.3 -apple-system, system-ui, sans-serif; cursor: default; }
.proto-pill .pp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
.proto-pill select, .proto-pill button { font: inherit; font-weight: 600; color: #000; background: #eee; border: 1px solid #999; border-radius: 8px; padding: 3px 8px; cursor: pointer; }
.proto-pill button:hover { background: #ffe14d; }
.proto-pill #ppVar { font-weight: 700; min-width: 150px; text-align: center; }
.proto-pill code { font: 10px/1.3 ui-monospace, Menlo, monospace; color: #222; word-break: break-all; text-align: center; }
#ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#ov .px { pointer-events: auto; cursor: default; }
#ov pre { margin: 6px 0 0; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.35); font: 11px/1.45 ui-monospace, Menlo, monospace; color: var(--ice); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
#ov code { font: 11px ui-monospace, Menlo, monospace; padding: 1px 6px; border-radius: 6px; background: rgba(233,243,255,.1); color: var(--ice); }
.err { --tone: var(--fail); } .warn { --tone: var(--human); } .info { --tone: var(--sky); } .ok { --tone: var(--ok); }

/* A: banner + marks */
.pa-banner { position: absolute; left: 0; right: 0; top: 0; z-index: 6; padding: 10px var(--gutter-r) 10px var(--gutter-l); background: color-mix(in srgb, var(--tone) 22%, #081325 90%); border-bottom: 2px solid var(--tone); font-size: 13px; line-height: 1.45; }
.pa-bt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.pa-bt b { color: var(--tone); } .pa-bt span { color: var(--ink); }
.pa-banner pre { max-width: 560px; }
.pa-mark { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.pa-ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 2px dashed var(--tone); opacity: .8; pointer-events: none; }
.pa-bw { position: absolute; left: 0; top: 0; }
.pa-bw:hover, .pa-bw.open { z-index: 5; }
.pa-badge { display: inline-flex; align-items: center; gap: 6px; transform: translate(-50%, -50%); font: 600 11px/1.2 ui-monospace, Menlo, monospace; color: var(--ink); background: #081325; border: 1.5px solid var(--tone); border-radius: 9999px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
.pa-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 8px var(--tone); }
.pa-pop { display: none; position: absolute; left: -12px; top: 16px; width: 280px; padding: 12px; border-radius: 12px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line), 0 24px 48px -16px rgba(0,0,0,.7); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font-size: 13px; line-height: 1.45; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.22.0/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script>
(() => {
  "use strict";
  /* ================= constants ================= */
  const SERVER = "github";
  const OWNER = "blutions";
  const REPOS = ["agenticoffice", "torre-de-control", "website"];
  const DEMO_REPOS = ["demo-alfa", "demo-beta", "demo-gamma"];
  const POLL = 60 * 1000;
  const WATCH_OPTS = { refetchInterval: POLL, cache: { staleTime: 0, gcTime: 24 * 60 * 60 * 1000 } };
  const AUTHZ = new Set(["needs_reauth", "server_not_connected", "selection_required", "server_not_found", "blocked_by_policy", "approval_required", "not_in_manifest", "not_granted", "capability_disabled", "capability_removed", "consent_required"]);
  const WORK_TTL = 30 * 60 * 1000;
  const LOG_WINDOW = 2 * 60 * 60 * 1000;
  const QUEUE_GAP = 1500;
  const BRANCH_RE = /^(feat|fix|improvement|chore|docs|adr)\/(\d+)-/i;
  const AGENT_RE = /co-authored-by:\s*claude|claude-session:/i;
  const STATE_LABEL = { todo: "Por hacer", doing: "En curso", blocked: "Bloqueado", review: "En revisión", done: "Hecho" };
  const TAU = Math.PI * 2;
  const PROTO = { galLabel: (repo, n) => `${repo}<span>${n} open</span>`, frame: () => {} };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const still = () => reduceMotion.matches;

  const $u = document.getElementById("u");
  const $gl = document.getElementById("gl");
  const $labels = document.getElementById("labels");
  const $hit = document.getElementById("hit");
  const $status = document.getElementById("status");
  const $log = document.getElementById("log");
  const $demo = document.getElementById("demo");
  const $demoGrid = document.getElementById("demoGrid");
  const $demoNote = document.getElementById("demoNote");
  const $tip = document.getElementById("tip");
  const $notice = document.getElementById("notice");
  const $desc = document.getElementById("uDesc");
  const $tDemo = document.getElementById("tDemo");
  const $tFit = document.getElementById("tFit");
  const $tFs = document.getElementById("tFs");

  let repos = REPOS.slice();
  let mcp = null;
  let demoMode = false;

  /* ================= helpers (shared with Seguimiento) ================= */
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const keyOf = (repo, n) => repo + "#" + n;
  const prKeyOf = (repo, n) => repo + "!" + n;
  const issueUrl = (repo, n) => `https://github.com/${OWNER}/${repo}/issues/${n}`;
  const prUrl = (repo, n) => `https://github.com/${OWNER}/${repo}/pull/${n}`;
  const login = a => typeof a === "string" ? a : (a && a.login) || "";
  const isMap = t => typeof t === "string" && t.startsWith("Mapa: ");
  const time = s => { const t = Date.parse(s || ""); return isNaN(t) ? 0 : t; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function parseRefs(text, fromRepo) {
    const out = [];
    const re = /(?:([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+))?#(\d+)/g;
    let m;
    while ((m = re.exec(text))) {
      const owner = m[1], repo = m[2] ? m[2] : fromRepo;
      if (m[1] && owner.toLowerCase() !== OWNER) continue;
      if (!repos.includes(repo)) continue;
      out.push({ repo, number: Number(m[3]) });
    }
    return out;
  }
  function blockedRefs(body, repo) {
    const line = String(body || "").split(/\r?\n/).find(l => /^\s*[*_]*\s*blocked by\s*[*_]*\s*:/i.test(l));
    if (!line) return [];
    return parseRefs(line.replace(/^[^:]*:/, ""), repo);
  }
  function closingRefs(body, prRepo) {
    const out = [];
    const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b\s*:?\s+((?:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#\d+)/gi;
    let m;
    while ((m = re.exec(String(body || "")))) out.push(...parseRefs(m[1], prRepo));
    return out;
  }
  function parseHtmlUrl(u) {
    const m = /github\.com\/(?:repos\/)?([^/]+)\/([^/]+)\/issues\/(\d+)/i.exec(u || "");
    if (!m || m[1].toLowerCase() !== OWNER || !repos.includes(m[2])) return null;
    return { repo: m[2], number: Number(m[3]) };
  }
  function asObj(p) {
    if (typeof p === "string") { try { return JSON.parse(p); } catch (e) { return null; } }
    return p;
  }
  function subList(p) {
    p = asObj(p);
    if (Array.isArray(p)) return p;
    if (!p || typeof p !== "object") return [];
    for (const k of ["sub_issues", "subIssues", "items", "issues", "nodes"]) {
      const v = asObj(p[k]);
      if (Array.isArray(v)) return v;
      if (v && Array.isArray(v.nodes)) return v.nodes;
    }
    return [];
  }
  function listOf(p, keys) {
    p = asObj(p);
    if (Array.isArray(p)) return p;
    if (!p || typeof p !== "object") return [];
    for (const k of keys) { const v = asObj(p[k]); if (Array.isArray(v)) return v; }
    return [];
  }
  // Label names, whatever the shape: ["a"], [{name:"a"}] or {nodes:[{name:"a"}]}.
  function labelNames(l) {
    l = asObj(l);
    const arr = Array.isArray(l) ? l : (l && Array.isArray(l.nodes) ? l.nodes : []);
    return arr.map(x => typeof x === "string" ? x : (x && x.name) || "").filter(Boolean).map(x => x.toLowerCase());
  }
  const WORK_LABEL = "en-curso";
  function whereOf(s, map) {
    for (const u of [s.html_url, s.url]) { const w = parseHtmlUrl(u); if (w) return w; }
    const full = (s.repository && (s.repository.full_name || s.repository.nameWithOwner)) || s.repository_full_name || "";
    const fm = /^([^/]+)\/([^/]+)$/.exec(typeof s.repository === "string" ? s.repository : full);
    if (fm) return (fm[1].toLowerCase() === OWNER && repos.includes(fm[2])) ? { repo: fm[2], number: Number(s.number) } : null;
    const ru = /repos\/([^/]+)\/([^/]+)$/.exec(s.repository_url || "");
    if (ru) return (ru[1].toLowerCase() === OWNER && repos.includes(ru[2])) ? { repo: ru[2], number: Number(s.number) } : null;
    return s.number ? { repo: map.repo, number: Number(s.number) } : null;
  }
  function ago(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return "ahora";
    const m = Math.round(s / 60);
    if (m < 60) return `${m} min`;
    const h = Math.round(m / 60);
    return h < 24 ? `${h} h` : `${Math.round(h / 24)} d`;
  }

  /* ================= snapshot =================
     One normalized picture of the work, the same shape live and in the demo:
     issues: key -> { key, repo, number, title, url, state, map, blockers, created, closedAt }
     maps:   key -> { key, repo, number, title, url, created, failed }
     prs:    key -> { key, repo, number, title, url, closes: [issueKey], head, created }
     work:   issueKey -> { kind: "agent" | "human", at, branch, baseline }
     claude: repo -> at (latest commit on a claude/... branch) */
  const emptySnap = () => ({ at: 0, issues: new Map(), maps: new Map(), prs: new Map(), work: new Map(), claude: new Map() });
  function cloneSnap(s) {
    return {
      at: s.at,
      issues: new Map([...s.issues].map(([k, v]) => [k, { ...v, blockers: v.blockers.slice() }])),
      maps: new Map([...s.maps].map(([k, v]) => [k, { ...v }])),
      prs: new Map([...s.prs].map(([k, v]) => [k, { ...v, closes: v.closes.slice() }])),
      work: new Map([...s.work].map(([k, v]) => [k, { ...v }])),
      claude: new Map(s.claude),
    };
  }
  // Hecho > En revisión > Bloqueado > En curso > Por hacer (docs/agents/issue-tracker.md, Seguimiento).
  function stateOf(closed, hasPr, blockers, openKeys, assignees) {
    if (closed) return "done";
    if (hasPr) return "review";
    if (blockers.some(k => openKeys.has(k))) return "blocked";
    if (assignees.length) return "doing";
    return "todo";
  }
  function restate(snap) {
    const openKeys = new Set([...snap.issues.values()].filter(i => i.state !== "done").map(i => i.key));
    const withPr = new Set([...snap.prs.values()].flatMap(p => p.closes));
    for (const i of snap.issues.values()) {
      if (i.state === "done") continue;
      i.state = stateOf(false, withPr.has(i.key), i.blockers, openKeys, i.assignees || []);
    }
  }

  /* ================= live data (watchTool, like Seguimiento) ================= */
  const watches = new Map();
  let pageError = null;
  let repoErrors = [];
  const agentOff = new Set(); // repos whose branches the connector cannot read
  const branchState = new Map(); // "repo:branch" -> { sha, at, kind, issue, claude }
  const branchRound = new Map(); // repo -> deliveries seen
  let commitChain = Promise.resolve();

  function ensure(key, tool, input) {
    if (watches.has(key)) return;
    const w = { tool, input, data: undefined, error: null, got: false, retried: false, storedAt: 0, unsub: null };
    watches.set(key, w);
    subscribe(key, w);
  }
  function subscribe(key, w) {
    w.unsub = mcp.watchTool(SERVER, w.tool, w.input, ev => onWatch(key, w, ev), WATCH_OPTS);
  }
  function drop(key) {
    const w = watches.get(key);
    if (!w) return;
    try { w.unsub && w.unsub(); } catch (e) {}
    watches.delete(key);
  }
  function onWatch(key, w, ev) {
    if (watches.get(key) !== w) return;
    const isBranch = key.startsWith("br:");
    if (ev.type === "data") {
      const r = ev.result || {};
      w.data = r.payload;
      w.storedAt = (r.cache && r.cache.storedAt) || Date.now();
      w.got = true; w.error = null; w.retried = false;
      if (pageError && !isBranch) { pageError = null; hideNotice(); }
      if (isBranch) { onBranches(key.slice(3), w.data); return; }
    } else {
      const e = ev.error || { code: "upstream_error", message: "" };
      if (isBranch) {
        // Branches are optional: without them only the "someone is working" signal goes dark.
        if (e.code === "tool_error" || AUTHZ.has(e.code)) { agentOff.add(key.slice(3)); drop(key); renderStatus(); return; }
        w.got = true; w.error = e; return;
      }
      if (AUTHZ.has(e.code)) {
        pageError = e;
        renderError();
        return;
      } else if (e.retryable && !w.retried) {
        w.retried = true;
        const wait = Math.max(e.retryAfterMs || 0, 800 + Math.random() * 1600);
        setTimeout(() => {
          if (watches.get(key) !== w) return;
          try { w.unsub && w.unsub(); } catch (x) {}
          subscribe(key, w);
        }, wait);
        return;
      } else {
        w.error = e; w.got = true;
      }
    }
    scheduleLive();
  }

  let liveTimer = 0;
  function scheduleLive() {
    // A refresh round lands as several deliveries; wait for the round to settle before diffing.
    clearTimeout(liveTimer);
    liveTimer = setTimeout(reconcileLive, 1800);
  }
  let liveSnapAt = 0;

  function reconcileLive() {
    if (pageError || !mcp) return;
    const reachable = new Set();
    const openIssues = [];
    repoErrors = [];
    for (const repo of repos) {
      let after = "";
      const seen = new Set();
      while (true) {
        const key = `issues:${repo}:${after}`;
        if (seen.has(key)) break;
        seen.add(key);
        reachable.add(key);
        const input = { owner: OWNER, repo, state: "OPEN", fields: ["number", "title", "body", "state", "assignees", "labels", "created_at", "updated_at"], perPage: 100 };
        if (after) input.after = after;
        ensure(key, "list_issues", input);
        const w = watches.get(key);
        if (w.error) repoErrors.push(repo);
        const p = asObj(w.data);
        if (!p || typeof p !== "object") break;
        for (const it of listOf(p, ["issues", "items", "nodes"])) {
          openIssues.push({ repo, number: Number(it.number), title: it.title || "", body: it.body || "", assignees: (it.assignees || []).map(login).filter(Boolean), created: time(it.created_at || it.createdAt), updated: time(it.updated_at || it.updatedAt), labels: labelNames(it.labels) });
        }
        const pi = p.pageInfo || {};
        if (pi.hasNextPage && pi.endCursor) after = pi.endCursor; else break;
      }
      const pk = `prs:${repo}`;
      reachable.add(pk);
      ensure(pk, "list_pull_requests", { owner: OWNER, repo, state: "open", fields: ["number", "title", "body", "draft", "html_url", "created_at", "head"], perPage: 100 });
      if (watches.get(pk).error) repoErrors.push(repo);
      if (!agentOff.has(repo)) {
        const bk = `br:${repo}`;
        reachable.add(bk);
        ensure(bk, "list_branches", { owner: OWNER, repo, perPage: 100 });
      }
    }
    const maps = openIssues.filter(i => isMap(i.title));
    for (const m of maps) {
      const k = `subs:${m.repo}#${m.number}`;
      reachable.add(k);
      ensure(k, "issue_read", { method: "get_sub_issues", owner: OWNER, repo: m.repo, issue_number: m.number, perPage: 100 });

    // Branch watches never hold the picture back.
    const ready = [...watches.entries()].every(([k, w]) => w.got || k.startsWith("br:"));
    renderStatus();
    if (!ready) return;
    const allFailed = [...watches.entries()].filter(([k]) => !k.startsWith("br:")).every(([, w]) => w.data === undefined);
    if (allFailed) { showNotice("No pude leer GitHub.", "GitHub no respondió. Vuelvo a intentarlo en la próxima actualización.", ""); return; }

    liveSnapAt = Math.min(...[...watches.entries()].filter(([k, w]) => !k.startsWith("br:") && !k.startsWith("subs:") && w.data !== undefined).map(([, w]) => w.storedAt));
    ingest(snap, { real: true });
    renderStatus();
  }

  function buildLiveSnap(openIssues, maps) {
    const snap = emptySnap();
    snap.at = Date.now();
    for (const repo of repos) {
      const p = watches.get(`prs:${repo}`)?.data;
      for (const pr of listOf(p, ["pull_requests", "pullRequests", "items"])) {
        const closes = [...new Set(closingRefs(pr.body, repo).map(r => keyOf(r.repo, r.number)))];
        const head = (pr.head && (pr.head.ref || pr.head.label)) || pr.head_ref || pr.headRefName || "";

    }
    const openKeys = new Set(openIssues.map(i => keyOf(i.repo, i.number)));
    const withPr = new Set([...snap.prs.values()].flatMap(p => p.closes));
    const make = (i, closed, closedAt) => {
      const key = keyOf(i.repo, i.number);
      const blockers = blockedRefs(i.body, i.repo).map(r => keyOf(r.repo, r.number));
      return { key, repo: i.repo, number: i.number, title: i.title, url: i.url || issueUrl(i.repo, i.number), assignees: i.assignees, labels: i.labels || [], updated: i.updated || 0, blockers, map: null, created: i.created || 0, closedAt: closedAt || 0, state: stateOf(closed, withPr.has(key), blockers, openKeys, i.assignees) };
    };
    for (const i of openIssues) {
      if (isMap(i.title)) {
        const key = keyOf(i.repo, i.number);
        snap.maps.set(key, { key, repo: i.repo, number: i.number, title: i.title.slice(6).trim(), url: issueUrl(i.repo, i.number), created: i.created, failed: !!watches.get(`subs:${key}`)?.error });
      } else snap.issues.set(keyOf(i.repo, i.number), make(i, false));
    }
    const sorted = [...maps].sort((a, b) => repos.indexOf(a.repo) - repos.indexOf(b.repo) || a.number - b.number);
    for (const m of sorted) {
      const mk = keyOf(m.repo, m.number);
      for (const s of subList(watches.get(`subs:${mk}`)?.data)) {
        if (isMap(s.title)) continue;
        const where = whereOf(s, m);
        if (!where) continue;
        const k = keyOf(where.repo, where.number);
        const closed = String(s.state || "").toLowerCase() === "closed";
        let t = snap.issues.get(k);
        if (!t) {
          t = make({ repo: where.repo, number: where.number, title: s.title || "", body: s.body || "", assignees: (s.assignees || []).map(login).filter(Boolean), url: s.html_url, created: time(s.created_at), updated: time(s.updated_at), labels: labelNames(s.labels) }, closed, time(s.closed_at));
          snap.issues.set(k, t);
        }
        if (!t.map) t.map = mk;
      }
    }
    // Someone working: a recent commit on <tipo>/<N>-slug, until its PR opens.
    const now = Date.now();
    const prHeads = new Set([...snap.prs.values()].map(p => p.repo + ":" + p.head));
    for (const [bk, b] of branchState) {
      if (!b.at || now - b.at > WORK_TTL) continue;
      if (b.claude) { if (!(snap.claude.get(b.repo) >= b.at)) snap.claude.set(b.repo, b.at); continue; }
      if (!b.issue || prHeads.has(bk)) continue;
      const i = snap.issues.get(b.issue);
      if (!i || i.state === "done") continue;
      const prev = snap.work.get(b.issue);
      if (!prev || prev.at < b.at) snap.work.set(b.issue, { kind: b.kind, at: b.at, branch: b.name, baseline: b.baseline });
    }
    // An agent at work: the `en-curso` label on an OPEN issue (set by a Claude Code hook). It wins over the branch signal
    // and lasts while the label is there; branches stay as a bonus (today they 403 and switch themselves off).
    for (const i of snap.issues.values()) {
      if (i.state === "done" || !(i.labels || []).includes(WORK_LABEL)) continue;
      const prev = snap.work.get(i.key);
      snap.work.set(i.key, { kind: "agent", at: (prev && prev.at) || i.updated || now, label: true });
    }
    return snap;
  }

  function onBranches(repo, data) {
    const round = (branchRound.get(repo) || 0) + 1;
    branchRound.set(repo, round);
    const list = listOf(data, ["branches", "items"]);
    const names = new Set();
    let budget = round === 1 ? 12 : 30;
    const openIssue = n => latest.issues.get(keyOf(repo, n));
    for (const br of list) {
      const name = String(br.name || br.ref || "");
      const sha = (br.commit && br.commit.sha) || br.sha || "";
      if (!name) continue;
      const m = BRANCH_RE.exec(name);
      const isClaude = /^claude\//i.test(name);
      if (!m && !isClaude) continue;
      const bk = repo + ":" + name;
      names.add(bk);
      const prev = branchState.get(bk);
      if (prev && prev.sha === sha) continue;
      const issue = m ? keyOf(repo, Number(m[2])) : null;
      const st = { repo, name, sha, at: prev ? prev.at : 0, kind: prev ? prev.kind : "human", issue, claude: isClaude, baseline: round === 1 };
      branchState.set(bk, st);
      // Only branches whose issue is open (or claude/...) are worth a commits call.
      if (m) { const i = openIssue(Number(m[2])); if (!i || i.state === "done") continue; }
      if (budget-- <= 0) continue;
      commitChain = commitChain.then(() => fetchCommits(st)).catch(() => {});

  async function fetchCommits(st) {

      const r = await mcp.callTool(SERVER, "list_commits", { owner: OWNER, repo: st.repo, sha: st.name, since: new Date(Date.now() - WORK_TTL).toISOString(), perPage: 3, fields: ["sha", "html_url", "commit", "author", "committer"] }, { cache: false });
      const list = listOf(r && r.payload, ["commits", "items"]);
      let best = null, bestAt = 0;

      }
      if (best) {

        st.kind = AGENT_RE.test(String((best.commit && best.commit.message) || best.message || "")) ? "agent" : "human";
      }
    } catch (e) {
      if (e && (e.code === "tool_error" || AUTHZ.has(e.code))) { agentOff.add(st.repo); drop("br:" + st.repo); renderStatus(); }
    }
  }

  // Merged or just closed? Asked only when an open PR vanishes, and once at start for the log.
  async function closedPrs(repo) {
    if (!mcp || demoMode) return [];
    try {
      const r = await mcp.callTool(SERVER, "list_pull_requests", { owner: OWNER, repo, state: "closed", sort: "updated", direction: "desc", perPage: 20, fields: ["number", "title", "body", "merged", "merged_at", "closed_at", "html_url"] }, { cache: false });

    } catch (e) { return null; }
  }

  /* ================= demo universe ================= */
  // Invented repos and titles. Never real GitHub data.
  const demoClosed = new Map(); // prKey -> { merged, at, closes, number, repo, title }
  const demoNext = new Map();
  function makeDemo() {

    const [A, B, G] = DEMO_REPOS;

    iss(A, 3, "Transcribir notas de voz", { map: 1, closed: 35 });
    iss(A, 4, "Elegir proveedor de voz", { map: 1, who: 1 });

    iss(A, 8, "Atajos de teclado para dictar", { map: 1 });
    iss(G, 9, "Página que explica la voz", { map: 1, mapRepo: A });
    map(A, 10, "Panel de costos", 3000);
    iss(A, 11, "Medir tokens por Agente", { map: 10, who: 1 });
    iss(A, 12, "Gráfico mensual", { map: 10, by: [11] });
    iss(A, 13, "Aviso de presupuesto", { map: 10, by: [11] });

    iss(B, 2, "Plantilla del correo", { map: 1, closed: 1500 });

    iss(B, 4, "Silenciar una Instalación", { map: 1, by: [3] });
    iss(B, 5, "Enlace al issue en el correo", { map: 1 });
    iss(B, 6, "Resumen diario", { map: 1, age: 70 });
    iss(B, 9, "Limpiar alertas viejas");

    iss(B, 11, "Documentar el formato de alerta", { who: 1 });

    iss(G, 8, "Optimizar imágenes");
    const pr = (repo, n, title, closes, ageMin, head) => s.prs.set(prKeyOf(repo, n), { key: prKeyOf(repo, n), repo, number: n, title: "Ejemplo: " + title, url: prUrl(repo, n), closes, head: head || "", created: now - ageMin * min });

    pr(B, 8, "Enlace al issue", [keyOf(B, 5)], 180, "feat/5-enlace-issue");
    pr(G, 12, "Ajustar tipografía", [], 50, "chore/12-tipografia");
    s.work.set(keyOf(A, 4), { kind: "agent", at: now - 6 * min, branch: "feat/4-proveedor-voz", baseline: true });
    s.work.set(keyOf(B, 3), { kind: "human", at: now - 12 * min, branch: "fix/3-agrupar", baseline: true });

  const DEMO_TITLES = ["Mover el selector de idioma", "Nuevo correo de bienvenida", "Medir el tiempo de carga", "Ordenar los filtros", "Aviso de sesión vencida", "Etiquetas en los Borradores", "Probar en tablets", "Revisar los textos de error", "Atajo para buscar", "Guardar la vista elegida"];
  const DEMO_MAPS = ["Oficina sin conexión", "Informes semanales", "Panel para clientes", "Agenda compartida"];
  function demoNum(repo) { const n = demoNext.get(repo) || 50; demoNext.set(repo, n + 1); return n; }

  /* ================= masks: data that arrived but whose event has not played yet ================= */
  let latest = emptySnap();     // what the scene is built from (live: last real snapshot, plus demo-button changes)
  let lastReal = null;          // last real snapshot, for real diffs
  let baselineDone = false;
  const hiddenIssues = new Set(), hiddenMaps = new Set(), hiddenPrs = new Set(), hiddenWork = new Set();
  const heldMap = new Map(), heldState = new Map(), ghostIssues = new Map(), ghostPrs = new Map();
  const litRepos = new Map();   // repo -> until (claude/... branch activity)

  function viewModel() {
    const issues = new Map();
    for (const [k, i] of latest.issues) {
      if (hiddenIssues.has(k)) continue;
      issues.set(k, { ...i, map: heldMap.has(k) ? heldMap.get(k) : i.map, state: heldState.has(k) ? heldState.get(k) : i.state });
    }
    for (const [k, i] of ghostIssues) if (!issues.has(k)) issues.set(k, { ...i, ghost: true, state: heldState.has(k) ? heldState.get(k) : i.state });
    const maps = new Map();
    for (const [k, m] of latest.maps) if (!hiddenMaps.has(k)) maps.set(k, m);
    for (const i of issues.values()) if (i.map && !maps.has(i.map)) i.map = null;
    const prs = new Map();
    for (const [k, p] of latest.prs) if (!hiddenPrs.has(k)) prs.set(k, p);
    for (const [k, p] of ghostPrs) if (!prs.has(k)) prs.set(k, p);
    const work = new Map();
    for (const [k, w] of latest.work) if (!hiddenWork.has(k) && issues.has(k)) work.set(k, w);
    return { issues, maps, prs, work };
  }

  /* ================= diff -> events ================= */
  function diff(a, b, fake) {
    const evs = [];
    const now = Date.now();
    for (const [k, m] of b.maps) {
      if (a.maps.has(k)) continue;
      hiddenMaps.add(k);
      const kids = [];
      for (const i of b.issues.values()) {
        if (i.map !== k) continue;
        if (!a.issues.has(i.key)) hiddenIssues.add(i.key);
        else heldMap.set(i.key, a.issues.get(i.key).map);
        kids.push(i.key);
      }
      evs.push({ type: "bigbang", map: k, kids, repo: m.repo, at: m.created || now, url: m.url, text: `Mapa nuevo: ${m.title}` });
    }
    const closes = new Map();
    for (const [k, i] of b.issues) {
      const o = a.issues.get(k);
      if (!o) {
        if (i.map && !a.maps.has(i.map)) continue;
        if (i.state === "done") continue;
        hiddenIssues.add(k);
        if (i.map) evs.push({ type: "flare", issue: k, map: i.map, repo: i.repo, at: i.created || now, url: i.url, text: `#${i.number} entra a ${mapName(b, i.map)}` });
        else evs.push({ type: "rift", issue: k, repo: i.repo, at: i.created || now, url: i.url, text: `Issue nuevo #${i.number}` });
        continue;
      }
      if (i.map && i.map !== o.map && a.maps.has(i.map)) {
        heldMap.set(k, o.map);
        evs.push({ type: "adopt", issue: k, map: i.map, repo: i.repo, at: now, url: i.url, text: `#${i.number} se suma a ${mapName(b, i.map)}` });
      }
      if (o.state !== "done" && i.state === "done") closes.set(k, o);
    }
    for (const [k, o] of a.issues) if (!b.issues.has(k) && o.state !== "done") closes.set(k, o);

    for (const [k, p] of b.prs) {
      if (a.prs.has(k)) continue;
      hiddenPrs.add(k);
      for (const ik of p.closes) {
        const o = a.issues.get(ik), n = b.issues.get(ik);
        if (o && n && o.state !== n.state && !heldState.has(ik)) heldState.set(ik, o.state);
      }
      const first = p.closes[0];
      const text = first ? `PR #${p.number} cierra ${refText(first, p.repo)}` : `PR #${p.number} abierto`;
      evs.push({ type: "comet", pr: k, repo: p.repo, at: p.created || now, url: p.url, text });
    }
    const gone = [...a.prs.values()].filter(p => !b.prs.has(p.key));
    const covered = new Set(gone.flatMap(p => p.closes));
    for (const [k, o] of closes) {
      if (!heldState.has(k)) heldState.set(k, o.state);
      if (!b.issues.has(k)) ghostIssues.set(k, { ...o });
      if (!covered.has(k)) evs.push({ type: "close", issue: k, repo: o.repo, at: now, url: o.url, text: `#${o.number} cerrado` });
    }
    for (const p of gone) ghostPrs.set(p.key, p);

    for (const [k, w] of b.work) {
      const o = a.work.get(k);
      if (o && o.kind === w.kind) continue;
      if (w.baseline) continue;
      const i = b.issues.get(k);
      if (!i) continue;
      hiddenWork.add(k);
      evs.push({ type: w.kind, issue: k, repo: i.repo, at: w.at || now, url: i.url, text: w.kind === "agent" ? `Un agente trabaja en #${i.number}` : `Alguien trabaja en #${i.number}` });
    }
    for (const [r, at] of b.claude) {
      if (a.claude.get(r) >= at) continue;
      evs.push({ type: "glow", repo: r, at, url: `https://github.com/${OWNER}/${r}/branches`, text: "Un agente trabaja en una rama claude", quiet: true });
    }
    enqueue(evs);
    if (gone.length) resolveGone(gone, fake).then(enqueue);
  }
  function mapName(snap, mk) { const m = snap.maps.get(mk) || latest.maps.get(mk); return m ? `«${m.title}»` : mk; }
  function refText(k, fromRepo) { const [r, n] = k.split("#"); return (r === fromRepo ? "" : r) + "#" + n; }

  async function resolveGone(gone, fake) {
    const byRepo = new Map();
    for (const p of gone) { if (!byRepo.has(p.repo)) byRepo.set(p.repo, []); byRepo.get(p.repo).push(p); }
    const evs = [];
    for (const [repo, list] of byRepo) {
      const closed = (fake || demoMode) ? null : await closedPrs(repo);
      for (const p of list) {
        let merged = false, at = Date.now();
        const d = demoClosed.get(p.key);
        if (d) { merged = d.merged; at = d.at; }
        else if (closed) {
          const c = closed.find(x => Number(x.number) === p.number);
          if (c) { merged = !!(c.merged || c.merged_at); at = time(c.merged_at || c.closed_at) || at; }
        }
        if (merged && p.closes.length) evs.push({ type: "supernova", pr: p.key, issues: p.closes.slice(), repo, at, url: p.url, text: `PR #${p.number} fusionado: cierra ${p.closes.map(k => refText(k, repo)).join(", ")}` });
        else if (merged) evs.push({ type: "prgone", pr: p.key, repo, at, url: p.url, text: `PR #${p.number} fusionado` });

  }

  /* ================= ingest ================= */
  function ingest(next, opts = {}) {
    if (!baselineDone) {
      latest = next;
      if (opts.real) lastReal = next;
      baselineDone = true;
      rebuildLog(next);
      Scene.refresh(true);
      return;
    }
    if (opts.real) {
      diff(lastReal || latest, next, false);
      lastReal = next;
    } else diff(latest, next, !!opts.fake);
    latest = next;
    Scene.refresh(false);
  }

  /* ================= queue ================= */
  // One after another, 1.5 s between starts. Built to grow (priorities, merging) later.
  const queue = [];
  let nextAt = 0;
  function enqueue(evs) {
    if (!evs || !evs.length) return;
    queue.push(...evs);
  }
  let holding = false;
  function pump(now) {
    if (holding || !queue.length || now < nextAt) return;
    const ev = queue.shift();
    nextAt = now + QUEUE_GAP;
    // On the tour, the camera goes to an event that is off screen (or too small) before it plays.
    if (Scene.touring() && Scene.needsTravel(targetsOf(ev))) {
      holding = true;
      Scene.travelForEvent(targetsOf(ev), () => { holding = false; nextAt = performance.now() + QUEUE_GAP; play(ev); });
      return;
    }
    play(ev);
  }
  function play(ev) {
    const fx = !still() && Scene.ready();
    switch (ev.type) {
      case "bigbang": hiddenMaps.delete(ev.map); for (const k of ev.kids) { hiddenIssues.delete(k); heldMap.delete(k); } break;
      case "rift": case "flare": hiddenIssues.delete(ev.issue); break;
      case "adopt": heldMap.delete(ev.issue); break;
      case "comet": hiddenPrs.delete(ev.pr); break;
      case "close": break;
      case "agent": case "human": hiddenWork.delete(ev.issue); break;
      case "glow": litRepos.set(ev.repo, ev.at + WORK_TTL); break;
      default: break;
    }
    if (ev.type !== "action") Scene.refresh(false, fx ? ev : null);
    if (fx) Scene.fx(ev);
    else settle(ev);
    // An Action logs its outcome when the flash lands.
    if (ev.type === "action" && fx) setTimeout(() => pushLog(ev), 2500);
    else pushLog(ev);
  }
  // Reduced motion (or no canvas): the state changes at once, without the show.
  function settle(ev) {
    if (ev.type === "comet") { const p = latest.prs.get(ev.pr); if (p) for (const k of p.closes) heldState.delete(k); }
    if (ev.type === "close") { heldState.delete(ev.issue); ghostIssues.delete(ev.issue); }
    if (ev.type === "supernova") { for (const k of ev.issues) { heldState.delete(k); ghostIssues.delete(k); } ghostPrs.delete(ev.pr); }
    if (ev.type === "prgone") ghostPrs.delete(ev.pr);
    Scene.refresh(false);

  /* ================= bitácora ================= */

  function pushLog(ev, silent) {
    const type = ev.type === "action" ? (ev.ok ? "ok" : "fail") : ev.type;
    log.push({ id: Math.random().toString(36).slice(2), type, text: ev.text, url: ev.url, repo: ev.repo, at: Math.min(Date.now(), ev.at || Date.now()), fresh: !silent, targets: targetsOf(ev) });

    if (ev.repo) t.repos.push(ev.repo);
    if (ev.issue) t.issues.push(ev.issue);
    if (ev.issues) t.issues.push(...ev.issues);

    if (ev.map) t.maps.push(ev.map);

      t.prs.push(ev.pr);

      if (p && !ev.issues) t.issues.push(...p.closes);
    }
    for (const k of t.issues) {
      const i = latest.issues.get(k) || ghostIssues.get(k);
      if (i && i.map) t.maps.push(i.map);

  // First load: rebuild the last 2 h of the log from dates, without playing anything.
  function rebuildLog(s) {

  }

  /* ================= status / notices ================= */
  // Freshness: "actualizado hace 40 s" and a dot. Amber when the last round failed or nothing fresh for 3 min.
  function agoSec(ms) {

    /* ----- galaxies ----- */
    function makeGalaxy(repo) {
      const h = hash(repo);
      const G = { repo, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, R: 120, Rt: 120, stars: [], sysOff: new Map(), orphanOff: new Map(), foreignOff: new Map(), cloud: null, count: 0, pulse: 0, flashTint: null, flashA: 0, wave: null, lit: 0, spin: h * TAU, dying: false };

    /* ----- nodes ----- */
    function drawIssue(n) {

    function drawSun(s) {

        s.body.position.set(s.x, s.y); s.body.scale.set(sunSc * a); s.body.alpha = Math.min(1, a);
        if (s.bodyR !== s.r) { s.bodyR = s.r; drawSun(s); }
        if (!s.hold) s.prog01 += (s.progTo - s.prog01) * (calm ? 1 : Math.min(1, dt * 2.2));
        if (Math.abs(s.prog01 - s.progDrawn) > 0.002) drawProg(s);
        s.prog.position.set(s.x, s.y); s.prog.scale.set(sunSc * a); s.prog.alpha = Math.min(1, a);
        s.orbit.position.set(s.x, s.y); s.orbit.alpha = Math.min(1, a);
        if (hl && !hl.suns.has(s)) for (const o of [s.glow, s.corona, s.body, s.prog, s.orbit]) o.alpha *= dimF;
      }

      // issues
      const sc = nodeK(k) / k;
      for (const [key, n] of nodes) {
        targetNode(n);
        if (n.travel) {
          const tr = n.travel, u = tr.t;
          const mx = (tr.fx + n.tx) / 2 - (n.ty - tr.fy) * 0.25 * tr.side, my = (tr.fy + n.ty) / 2 + (n.tx - tr.fx) * 0.25 * tr.side;
          const v = 1 - u;
          n.x = v * v * tr.fx + 2 * v * u * mx + u * u * n.tx; n.y = v * v * tr.fy + 2 * v * u * my + u * u * n.ty; n.vx = n.vy = 0;
        } else if (K) spring(n, dt, K); else { n.x = n.tx; n.y = n.ty; }
        if (n.hist) { n.hist.push(n.x, n.y); if (n.hist.length > 60) n.hist.splice(0, 2); }
        if (!n.hold) n.ap += (n.apTo - n.ap) * (calm ? 1 : Math.min(1, dt * (n.dying ? 2 : 3)));
        if (n.dying && n.ap < 0.02) { destroyNode(n); nodes.delete(key); continue; }
        const a = clamp(n.ap, 0, 1.4), al = Math.min(1, a);
        const w = n.work && (n.work.label || wall - n.work.at < WORK_TTL) ? n.work : null;
        const beat = w && !calm ? 0.5 + 0.5 * Math.sin(T * 2.4 + n.h1 * TAU) : 0;
        n.body.position.set(n.x, n.y); n.body.scale.set(sc * a * (1 + beat * 0.12)); n.body.alpha = al;
        n.glow.position.set(n.x, n.y); n.glow.scale.set(n.glowS * sc * a * (1 + beat * 0.5)); n.glow.alpha = (n.glowA + beat * 0.25 + (w ? 0.15 : 0)) * al;
        if (n.ping > 0) { n.ping = Math.max(0, n.ping - dt); n.glow.alpha += n.ping * 0.5; }
        // satellite: someone is working on it
        n.satA += ((w ? 1 : 0) - n.satA) * Math.min(1, dt * 1.5);
        if (n.satA > 0.01) {
          const col = w ? (w.kind === "agent" ? C.agent : C.human) : n.sat.tint;
          const ang = calm ? -0.8 : T * (w && w.kind === "agent" ? 2.6 : 1.7) + n.h2 * TAU;
          const rr = 11 * sc;
          n.sat.tint = col; n.satGlow.tint = col;
          n.sat.position.set(n.x + Math.cos(ang) * rr, n.y + Math.sin(ang) * rr * 0.75); n.sat.scale.set(3.2 * sc / 16); n.sat.alpha = n.satA * al;
          n.satGlow.position.set(n.sat.x, n.sat.y); n.satGlow.scale.set(12 * sc / 64); n.satGlow.alpha = n.satA * 0.6 * al;
        } else { n.sat.alpha = 0; n.satGlow.alpha = 0; }
        if (hl && !hl.nodes.has(n)) for (const o of [n.body, n.glow, n.sat, n.satGlow]) o.alpha *= dimF;
        else if (hl) n.glow.alpha += hlA * 0.25;
        if (w && !n.label) { n.label = document.createElement("span"); n.label.className = "lab lab-work"; $labels.appendChild(n.label); }
        if (n.label) {
          if (!w && n.satA < 0.05) { n.label.remove(); n.label = null; }
          else {
            n.label.className = "lab lab-work" + (w && w.kind === "human" ? " human" : "");
            const txt = `#${n.data.number} <i>${w ? (w.kind === "agent" ? "agente" : "persona") : ""}</i>`;
            if (n.label._t !== txt) { n.label.innerHTML = txt; n.label._t = txt; }
          }
        }
      }

      // trails, cross-repo curves
      drawDyn(dt, k, dimF);
      drawHl(k, calm);
      stepParts(dt);
      placeLabels(k);
      PROTO.frame();
      if (mouse) { const h = pickAt(mouse.x, mouse.y); if (h !== hover) setHover(h); }
      if (tipFor) placeTip();
      app.ticker.maxFPS = (fxBusy > 0 || parts.length || camTo || filters.size || hl) ? 60 : 30;
    }

    function drawDyn(dt, k, dimF) {
      dyn.clear();
      // A child in another repo: a long thin curve to its sun.
      for (const n of nodes.values()) {
        if (n.role !== "foreign" || !n.sun) continue;
        const a = Math.min(n.ap, n.sun.ap, 1);
        if (a < 0.02) continue;
        const path = { a: { x: n.x, y: n.y }, b: { x: n.sun.x, y: n.sun.y }, bend: (n.h1 < 0.5 ? -1 : 1) * 0.16 };
        const m = qpt(path, 0.5);
        const mx = 2 * m.x - (path.a.x + path.b.x) / 2, my = 2 * m.y - (path.a.y + path.b.y) / 2;
        const lit = hl && hl.nodes.has(n) && hl.suns.has(n.sun);
        const lf = !hl ? 1 : lit ? 1 + hlA * 2.2 : dimF;
        dyn.moveTo(path.a.x, path.a.y).quadraticCurveTo(mx, my, path.b.x, path.b.y).stroke({ width: (0.9 + (lit ? hlA * 0.8 : 0)) / k, color: C.sky, alpha: Math.min(1, 0.24 * a * lf) });
      }
      // Adoption path, fading behind the traveller
      for (const n of nodes.values()) {
        if (!n.hist || n.hist.length < 4) continue;
        const h = n.hist, cnt = h.length / 2;
        for (let i = 1; i < cnt; i++) dyn.moveTo(h[i * 2 - 2], h[i * 2 - 1]).lineTo(h[i * 2], h[i * 2 + 1]).stroke({ width: (0.6 + 1.6 * i / cnt) / k, color: C.ice, alpha: 0.35 * i / cnt });
        if (!n.travel) h.splice(0, 4);
      }
      // PR trails: tapered, they stay while the PR is open.
      for (const [key, t] of trails) {
        t.alpha += (t.aTo - t.alpha) * Math.min(1, dt * (t.dying ? 1.2 : 2));
        if (t.dying && t.alpha < 0.01) { if (t.head) { t.head.head.destroy(); t.head.core.destroy(); } gsap.killTweensOf(t); trails.delete(key); continue; }
        const path = trailPath(t);
        if (!path || t.prog <= 0.001) continue;
        const N = 26, end = t.prog;
        const lit = hl && hl.trails.has(t);
        const lf = !hl ? 1 : lit ? 1 + hlA * 0.9 : dimF;
        let prev = qpt(path, 0);
        for (let i = 1; i <= N; i++) {
          const u = end * i / N, p = qpt(path, u);
          const q = i / N;
          // Brightest at the head while it travels; once landed the trail reads issue -> sun.
          const f = t.head ? q : 0.35 + 0.65 * (1 - Math.abs(q - 0.5) * 1.2);
          dyn.moveTo(prev.x, prev.y).lineTo(p.x, p.y).stroke({ width: (0.6 + 2.2 * f) / Math.max(0.5, k), color: i > N - 4 && t.head ? C.ice : C.blueText, alpha: Math.min(1, t.alpha * (0.15 + 0.55 * f) * lf) });
          prev = p;
        }
      }
    }

    /* ----- highlight from the log ----- */
    const isLitG = G => !hl || hl.gals.has(G);
    function resolveHl(t) {
      const r = { nodes: new Set(), suns: new Set(), gals: new Set(), trails: new Set(), ringGals: new Set() };
      const fallback = new Set();
      for (const k of t.issues) {
        const n = nodes.get(k);
        if (n && !n.dying) { r.nodes.add(n); continue; }
        // Gone from the sky (closed orphan, not loaded): light its sun, else its galaxy.
        const i = latest.issues.get(k) || ghostIssues.get(k);
        const s = i && i.map ? suns.get(i.map) : null;
        if (s && !s.dying) r.suns.add(s); else fallback.add(k.split("#")[0]);
      }
      for (const k of t.maps) { const s = suns.get(k); if (s && !s.dying) r.suns.add(s); else fallback.add(k.split("#")[0]); }
      for (const k of t.prs) { const tr = trails.get(k); if (tr && !tr.dying) r.trails.add(tr); }
      for (const repo of [...t.repos, ...fallback]) { const G = galaxies.get(repo); if (G) r.gals.add(G); }
      // A galaxy gets the ring only when nothing more precise in it is left to light.
      for (const G of r.gals) {
        const has = [...r.nodes].some(n => n.data.repo === G.repo) || [...r.suns].some(s => s.data.repo === G.repo) || [...r.trails].some(tr => tr.pr.repo === G.repo);
        if (!has) r.ringGals.add(G);
      }
      return r;
    }
    function drawHl(k, calm) {
      hlG.clear();
      const pts = [];
      if (hl && hlA > 0.01) {
        const pulse = calm ? 0.5 : 0.5 + 0.5 * Math.sin(performance.now() / 1000 * 3.2);
        const st = (x, y, r, w) => { hlG.circle(x, y, r).stroke({ width: w / k, color: C.ice, alpha: 0.75 * hlA }); hlG.circle(x, y, r + (3 + pulse * 5) / k).stroke({ width: 1 / k, color: C.sky, alpha: (0.5 - pulse * 0.35) * hlA }); };
        for (const n of hl.nodes) { st(n.x, n.y, (5 * nodeK(k) + 6) / k, 1.5); pts.push(n); }
        for (const s of hl.suns) { st(s.x, s.y, (s.r * sunK(k) + 12) / k, 1.5); pts.push(s); }
        for (const G of hl.ringGals) { st(G.x, G.y, G.R * 0.92, 1.5); pts.push(G); }
      }
      placeArrows(pts);
    }
    // A target off screen gets a small pointer on the edge, aimed at it.
    function placeArrows(pts) {
      const m = 28;
      let used = 0;
      for (const o of pts) {
        if (used >= 4) break;
        const p = toScreen(o.x, o.y);
        if (p.x >= m && p.x <= W - m && p.y >= m && p.y <= H - m) continue;
        let el = arrows[used];
        if (!el) { el = document.createElement("span"); el.className = "hl-arrow"; el.setAttribute("aria-hidden", "true"); el.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`; $labels.appendChild(el); arrows[used] = el; }
        const cx = W / 2, cy = H / 2, ang = Math.atan2(p.y - cy, p.x - cx);
        const x = clamp(p.x, m, W - m), y = clamp(p.y, m, H - m);
        el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px) rotate(${ang}rad)`;
        el.style.opacity = String(hlA);
        used++;
      }
      for (let i = used; i < arrows.length; i++) arrows[i].style.opacity = "0";
    }

    /* ----- labels over the canvas ----- */
    function placeLabels(k) {
      // The chrome (brand, tools, log, demo panel) is off limits for titles.
      const ur = $u.getBoundingClientRect();
      const boxes = [];
      for (const el of chrome) {
        if (el.hidden || !el.offsetWidth) continue;
        const r = el.getBoundingClientRect();
        boxes.push({ x0: r.left - ur.left - 4, x1: r.right - ur.left + 4, y0: r.top - ur.top - 4, y1: r.bottom - ur.top + 4 });
      }

      const nChrome = boxes.length;
      for (const G of galaxies.values()) {
        const p = toScreen(G.x, G.y - G.R * 0.98);
        const lw = G.label.offsetWidth || 120;
        const x = clamp(p.x - lw / 2, 8, W - lw - 8), y = Math.max(8, p.y - 30);
        G.label.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
        const gb = { x0: x, x1: x + lw, y0: y, y1: y + 26 };
        const under = boxes.slice(0, nChrome).some(o => gb.x0 < o.x1 && gb.x1 > o.x0 && gb.y0 < o.y1 && gb.y1 > o.y0);
        G.label.style.opacity = under ? "0" : String(Math.min(1, introA * 1.4) * (isLitG(G) ? 1 : 1 - 0.65 * hlA));
        if (!under) boxes.push(gb);
      }

      // Suns are obstacles too: a title never covers another sun.
      const discs = [...suns.values()].filter(s => !s.dying && s.ap > 0.3).map(s => { const p = toScreen(s.x, s.y), r = s.r * sunK(k) + 6; return { s, x0: p.x - r, x1: p.x + r, y0: p.y - r, y1: p.y + r }; });
      const order = [...suns.values()].sort((a, b) => b.total - a.total);
      for (const s of order) {
        const el = s.label;
        const a = Math.min(1, s.ap) * introA;
        const p = toScreen(s.x, s.y);
        const sr = s.r * sunK(k);
        const outer = s.rings.length ? s.rings[s.rings.length - 1] * k : 0;
        const w = el.offsetWidth || 120, h = el.offsetHeight || 34;
        const x = p.x - w / 2, y = p.y + Math.max(sr + 12, outer + 6);
        const box = { x0: x, x1: x + w, y0: y, y1: y + h };
        const hitBox = o => box.x0 < o.x1 && box.x1 > o.x0 && box.y0 < o.y1 && box.y1 > o.y0;
        const clash = boxes.some(hitBox) || discs.some(o => o.s !== s && hitBox(o));
        const show = !s.dying && a > 0.3 && !clash && k > 0.22;
        if (show) boxes.push(box);
        el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
        el.classList.toggle("off", !show);
        el.style.opacity = show && hl ? String(hl.suns.has(s) ? 1 : 1 - 0.65 * hlA) : "";
        el.style.visibility = show || el.style.opacity !== "0" ? "" : "hidden";
      }
      for (const n of nodes.values()) {
        if (!n.label) continue;
        const p = toScreen(n.x, n.y);
        const off = 9 * nodeK(k);
        n.label.style.transform = `translate(${Math.round(p.x + off + 6)}px, ${Math.round(p.y - 7)}px)`;
        n.label.style.opacity = String(Math.min(1, n.satA * 1.2) * (!hl || hl.nodes.has(n) ? 1 : 1 - 0.65 * hlA));
      }
    }

    /* ----- hover / tooltip ----- */
    function pickAt(mx, my) {
      let best = null, bd = Infinity;
      const k = cam.k;
      const sr = 5 * nodeK(k);
      for (const n of nodes.values()) {
        if (n.dying || n.ap < 0.5) continue;
        const p = toScreen(n.x, n.y), d = Math.hypot(p.x - mx, p.y - my);
        if (d <= sr + 9 && d < bd) { bd = d; best = n; }
      }
      for (const s of suns.values()) {
        if (s.dying || s.ap < 0.5) continue;
        const p = toScreen(s.x, s.y), d = Math.hypot(p.x - mx, p.y - my);
        if (d <= s.r * sunK(k) + 8 && d < bd) { bd = d; best = s; }
      }
      return best;
    }
    function setHover(n) { hover = n; showTip(); }
    function showTip() {
      const n = hover || selected;
      if (!n) { $tip.classList.remove("on"); $hit.hidden = true; tipFor = null; return; }
      const touch = !hover;
      const isSun = suns.get(n.key) === n;
      const d = n.data;
      if (tipFor !== n || $tip.classList.contains("touch") !== touch || $tip._state !== (isSun ? n.done + "/" + n.total : d.state + (n.work ? n.work.kind : ""))) {
        tipFor = n;
        $tip._state = isSun ? n.done + "/" + n.total : d.state + (n.work ? n.work.kind : "");
        const map = !isSun && d.map ? suns.get(d.map) : null;
        const state = isSun ? `<span class="chip"><span class="g g-sun" aria-hidden="true"></span>Mapa · ${n.done} de ${n.total} hechos</span>` : `<span class="chip"><span class="g g-${d.state === "done" ? "todo" : d.state}" aria-hidden="true"></span>${STATE_LABEL[d.state]}${n.work ? (n.work.kind === "agent" ? " · un agente trabaja" : " · alguien trabaja") : ""}</span>`;
        $tip.innerHTML = `<span class="tip-ref">${esc(d.repo)} <b>#${d.number}</b>${map ? ` · ${esc(map.data.title)}` : ""}</span>
          <span class="tip-title">${esc(d.title)}</span>
          <span class="tip-foot">${state}${touch ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Abrir en GitHub</a>` : ""}</span>`;
        $tip.classList.toggle("touch", touch);
        $tip.tw = $tip.offsetWidth; $tip.th = $tip.offsetHeight;
        $hit.href = d.url;
        $hit.setAttribute("aria-label", `${d.repo} #${d.number}: ${d.title}`);
      }
      $hit.hidden = touch;
      $tip.classList.add("on");
      placeTip();
    }
    function placeTip() {
      const n = tipFor;
      if (!n) return;
      const isSun = suns.get(n.key) === n;
      const p = toScreen(n.x, n.y);
      const r = isSun ? n.r * sunK(cam.k) : 5 * nodeK(cam.k);
      const tw = $tip.tw || 220, th = $tip.th || 70;
      let x = clamp(p.x - tw / 2, 8, Math.max(8, W - tw - 8));
      let y = p.y - r - 14 - th;
      if (y < 8) y = p.y + r + 14;
      $tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
      if (!$hit.hidden) {
        const d = Math.max(28, r * 2 + 12);
        $hit.style.width = $hit.style.height = d + "px";
        $hit.style.transform = `translate(${p.x - d / 2}px, ${p.y - d / 2}px)`;
      }
    }

    /* ----- input: d3.zoom for pan / pinch / wheel ----- */
    function bindInput() {
      const blocked = t => t && t.closest && t.closest(".tools, .log, .demo, .tip, .notice, .search, .lab, .hit, button, a, .px");
      zoom = d3.zoom()
        .scaleExtent([0.06, 4])
        .clickDistance(5)
        .filter(ev => !blocked(ev.target) && (!ev.ctrlKey || ev.type === "wheel") && !ev.button)
        .on("zoom", ev => {
          if (!ev.sourceEvent) return;
          stopFlight();
          autoFit = false; camTo = null;
          cam.x = ev.transform.x; cam.y = ev.transform.y; cam.k = ev.transform.k;
          if (selected) { selected = null; showTip(); }
        });
      zsel = d3.select($u);
      zsel.call(zoom).on("dblclick.zoom", null);
      const local = e => { const r = $u.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      $u.addEventListener("pointermove", e => {
        if (e.pointerType !== "mouse") return;
        if (blocked(e.target) && e.target !== $hit) { mouse = null; if (hover) setHover(null); return; }
        mouse = local(e);
      });
      $u.addEventListener("pointerleave", () => { mouse = null; if (hover) setHover(null); });
      let down = null;
      $u.addEventListener("pointerdown", e => { down = local(e); }, true);
      $u.addEventListener("pointerup", e => {
        if (e.pointerType === "mouse" || blocked(e.target)) return;
        const p = local(e);
        if (!down || Math.hypot(p.x - down.x, p.y - down.y) > 8) return;
        const n = pickAt(p.x, p.y);
        if (n || selected) { selected = n; hover = null; showTip(); }
      });
    }
    function keyPan(dx, dy, kf) {
      stopFlight();
      const t = { x: cam.x + dx, y: cam.y + dy, k: cam.k };
      if (kf) { const k2 = clamp(cam.k * kf, 0.06, 4); t.x = W / 2 - (W / 2 - cam.x) / cam.k * k2; t.y = H / 2 - (H / 2 - cam.y) / cam.k * k2; t.k = k2; }
      autoFit = false; camTo = null; Object.assign(cam, t); syncZoom(t);
    }

    return {
      init,
      ready: () => ok,
      refresh,
      fx,
      recenter,
      keyPan,
      closeTip: () => { selected = null; hover = null; showTip(); },
      travel,
      needsTravel,
      travelForEvent,
      tourStart,
      tourStop,
      touring: () => !!tour,
      searchables: () => {
        const out = [];
        for (const s of suns.values()) if (!s.dying && s.ap > 0.3) out.push({ key: s.key, kind: "map", repo: s.data.repo, number: s.data.number, title: s.data.title, state: "map" });
        for (const n of nodes.values()) if (!n.dying && n.ap > 0.3) out.push({ key: n.key, kind: "issue", repo: n.data.repo, number: n.data.number, title: n.data.title, state: n.data.state });
        return out;
      },
      highlight: t => { hlT = t && (t.issues.length || t.maps.length || t.repos.length || t.prs.length) ? t : null; },
      tipOpen: () => !!(selected || hover),
      nodesOf: () => nodes,
      sunsOf: () => suns,
      galaxyRepos: () => [...galaxies.keys()],
      galaxyScreen: repo => {
        const G = galaxies.get(repo);
        if (!G) return null;
        const p = toScreen(G.x, G.y), c = G.cloud ? toScreen(G.x + G.cloud.x, G.y + G.cloud.y) : null;
        return { x: p.x, y: p.y, r: G.R * cam.k, cloud: c ? { x: c.x, y: c.y, r: G.cloud.r * cam.k } : null };
      },
    };
  })();

  /* ================= demo panel ================= */
  const DEMO_BUTTONS = [
    { id: "rift", label: "Brecha", hint: "Issue nuevo sin mapa", color: "--ice" },
    { id: "bigbang", label: "Big bang", hint: "Mapa nuevo", color: "--sky" },
    { id: "flare", label: "Llamarada", hint: "Issue nuevo en un mapa", color: "--sky" },
    { id: "adopt", label: "Adopción", hint: "Un mapa adopta un issue", color: "--blue-text" },
    { id: "agent", label: "Agente", hint: "Un agente trabaja", color: "--agent" },
    { id: "human", label: "Humano", hint: "Una persona trabaja", color: "--human" },
    { id: "comet", label: "Cometa", hint: "PR nuevo", color: "--blue-text" },
    { id: "supernova", label: "Supernova", hint: "PR fusionado", color: "--sky" },
    { id: "prclosed", label: "PR cerrado", hint: "Cerrado sin fusionar", color: "--ink-faint" },
