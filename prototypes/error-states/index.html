  };

  /* ---------- Variant A: banner at the top + ring and badge on failing galaxies ---------- */
  function renderA() {
    const c = cur(), u = c.universe;
    let html = "";
    if (u.status === "demo" || u.status === "error" || u.empty) {
      const tone = u.status === "error" ? (u.code === "rate_limited" ? "warn" : "err") : "info";
      html += `<div class="pa-banner px ${tone}" id="paBanner"><div class="pa-bt"><b>${esc(u.title)}</b>${u.code ? `<code>${u.code}</code>` : ""}<span>${fill(u.hint, u)}</span></div>${u.snippet ? `<pre>${esc(u.snippet)}</pre>` : ""}</div>`;
    }
    const marks = c.repos.filter(r => r.status !== "ok" || r.stale || r.data === "nomaps");
    for (const r of marks) {
      const tone = r.status !== "ok" ? (r.stale ? "warn" : "err") : "info";
      const label = r.code ? r.code + (r.stale ? " · stale" : "") : "no Maps";
      const title = r.code ? CODE_TITLE[r.code] : "No Maps yet";
      html += `<div class="pa-mark ${tone}" data-repo="${esc(r.name)}"><i class="pa-ring"></i><div class="pa-bw px"><button type="button" class="pa-badge"><span class="pa-dot"></span>${esc(label)}</button><div class="pa-pop"><b>${esc(r.full)}</b><em>${esc(title)}</em><p>${esc(r.hint)}</p>${r.snippet ? `<pre>${esc(r.snippet)}</pre>` : ""}${r.stale ? `<small>Showing data from ${fmtAge(r.ageMin)}.</small>` : ""}</div></div></div>`;
    }
    $ov.innerHTML = html;
    const b = document.getElementById("paBanner");
    $u.style.setProperty("--gutter-t", b ? (b.offsetHeight + 28) + "px" : "16px");
    for (const el of $ov.querySelectorAll(".pa-mark")) {
      const bw = el.querySelector(".pa-bw"), ring = el.querySelector(".pa-ring");
      bw.querySelector("button").addEventListener("click", () => bw.classList.toggle("open"));
      anchors.push({ repo: el.dataset.repo, el, fn: (g) => {
        place(el, g.x, g.y);
        const r = g.r + 10;
        ring.style.cssText = `width:${2 * r}px;height:${2 * r}px;margin:${-r}px 0 0 ${-r}px`;
        bw.style.transform = `translate(${Math.round(Math.cos(-0.8) * r)}px,${Math.round(Math.sin(-0.8) * r)}px)`;
        bw.classList.toggle("flip", g.x + r > innerWidth - 320);
      } });
    }
  }

  /* ---------- Variant B: status dock listing every repo, stale galaxies dimmed ---------- */
  function renderB() {
    const c = cur(), u = c.universe;
    const utone = u.status === "error" ? (u.code === "rate_limited" ? "warn" : "err") : u.status === "demo" ? "info" : "ok";
    const ulabel = u.status === "error" ? "error: " + u.code : u.status === "demo" ? "demo" : u.empty ? "ok, no repos" : "ok";
    let html = `<aside class="pb-dock px"><header><span>Repos</span><span class="pb-u ${utone}"><i></i>universe: ${esc(ulabel)}</span></header>`;
    if (u.title) html += `<div class="pb-note ${utone}"><b>${esc(u.title)}</b><p>${fill(u.hint, u)}</p>${u.snippet ? `<pre>${esc(u.snippet)}</pre>` : ""}</div>`;
    html += `<ul>`;
    if (c.demo) html += `<li class="pb-empty">Showing 3 made-up demo repos.</li>`;
    else if (!c.repos.length) html += `<li class="pb-empty">No repos configured.</li>`;
    for (const r of c.repos) {
      const tone = r.status !== "ok" ? (r.stale ? "warn" : "err") : "ok";
      const age = r.status === "ok" ? "live" : r.stale ? fmtAge(r.ageMin) : "never loaded";
      let sub;
      if (r.status !== "ok") sub = `<code>${r.code}</code> ${esc(r.hint)}${r.snippet ? `<pre>${esc(r.snippet)}</pre>` : ""}`;
      else if (r.data === "nomaps") sub = `${r.open} open, no Maps yet. ${esc(NOMAPS_HINT.split(" See ")[0])} See docs/repo-requirements.md.`;
      else if (r.data === "noissues") sub = "No open issues.";
      else sub = `${r.open} open`;
      html += `<li class="pb-row ${tone}" data-repo="${esc(r.name)}"><i class="pb-dot"></i><div><div class="pb-top"><b>${esc(r.full)}</b><span>${age}</span></div><div class="pb-sub">${sub}</div></div></li>`;
    }
    html += `</ul></aside>`;
    for (const r of c.repos) if (r.stale || r.data === "none") html += `<i class="pb-dim" data-repo="${esc(r.name)}"></i>`;
    $ov.innerHTML = html;
    for (const el of $ov.querySelectorAll(".pb-dim")) anchors.push({ repo: el.dataset.repo, el, fn: g => { const r = g.r * 1.12; el.style.cssText = `width:${2 * r}px;height:${2 * r}px;transform:translate(${Math.round(g.x - r)}px,${Math.round(g.y - r)}px)`; } });
    for (const li of $ov.querySelectorAll(".pb-row")) {
      li.addEventListener("pointerenter", () => Scene.highlight({ issues: [], maps: [], prs: [], repos: [li.dataset.repo] }));
      li.addEventListener("pointerleave", () => Scene.highlight(null));
    }
  }

  /* ---------- Variant C: everything in space; failing galaxies are ghosts with a card at their own spot ---------- */
  function renderC() {
    const c = cur(), u = c.universe;
    let html = "";
    const hasData = c.demo || c.repos.some(r => r.data !== "none");
    if (u.status === "demo") html += `<div class="pc-veil"></div>`;
    if (u.status === "demo" || u.status === "error" || u.empty) {
      const tone = u.status === "error" ? (u.code === "rate_limited" ? "warn" : "err") : "info";
      // Nothing to look at -> centred in empty space. Data still on screen -> parked at the top so it is not covered.
      const pos = u.code === "rate_limited" ? "top" : "centre";
      html += `<div class="pc-card pc-u ${pos} ${tone} px"><div class="pc-h"><b>${esc(u.title)}</b>${u.code ? `<code>${u.code}</code>` : ""}</div><p>${fill(u.hint, u)}</p>${u.snippet ? `<pre>${esc(u.snippet)}</pre>` : ""}</div>`;
    }
    for (const r of c.repos) {
      if (r.status !== "ok" && hasData) {
        const tone = r.stale ? "warn" : "err";
        const under = r.data !== "none";
        const body = u.status === "error" ? `<p>Showing data from ${fmtAge(r.ageMin)}.</p>` : `<p>${esc(r.hint)}</p>${r.snippet ? `<pre>${esc(r.snippet)}</pre>` : ""}${r.stale ? `<p class="pc-age">Showing data from ${fmtAge(r.ageMin)}.</p>` : ""}`;
        html += `<i class="pc-ghost ${tone}" data-repo="${esc(r.name)}"></i><div class="pc-card pc-r ${tone} px" data-repo="${esc(r.name)}" data-under="${under ? 1 : 0}"><div class="pc-h"><b>${esc(r.full)}</b><code>${r.code}${r.stale ? " · stale" : ""}</code></div>${body}</div>`;
      } else if (r.data === "nomaps") {
        html += `<div class="pc-card pc-r info px" data-repo="${esc(r.name)}" data-gas="1"><div class="pc-h"><b>No Maps yet</b></div><p>${esc(r.hint)}</p></div>`;
      } else if (r.data === "noissues") {
        html += `<div class="pc-quiet" data-repo="${esc(r.name)}">${esc(r.full)}: no open issues</div>`;
      }
    }
    $ov.innerHTML = html;
    for (const el of $ov.querySelectorAll(".pc-ghost")) anchors.push({ repo: el.dataset.repo, el, fn: g => { const r = g.r * 1.05; el.style.cssText = `width:${2 * r}px;height:${2 * r}px;transform:translate(${Math.round(g.x - r)}px,${Math.round(g.y - r)}px)`; } });
    for (const el of $ov.querySelectorAll(".pc-r, .pc-quiet")) anchors.push({ repo: el.dataset.repo, el, fn: g => {
      const w = el.offsetWidth, h = el.offsetHeight;
      let x = g.x - w / 2, y;
      if (el.dataset.gas && g.cloud) { x = g.cloud.x - w / 2; y = g.cloud.y + g.cloud.r + 6; }
      else if (el.dataset.under === "1" || el.classList.contains("pc-quiet")) y = g.y + g.r * 0.55;
      else y = g.y - h / 2;
      place(el, clamp(x, 8, innerWidth - w - 8), y);
    } });
  }

  const RENDER = { A: renderA, B: renderB, C: renderC };
  function apply() {
    const c = cur();
    anchors = [];
    $u.style.removeProperty("--gutter-t");
    $u.dataset.variant = variant;
    let names = c.demo ? ["demo-alfa", "demo-beta", "demo-gamma"] : c.repos.map(r => r.name);
    // C draws no galaxies at all when the universe has nothing to show (card in empty space).
    if (variant === "C" && c.universe.status === "error" && c.repos.every(r => r.data === "none")) names = [];
    repos = names;
    demoMode = !!c.demo;
    latest = buildSnap(c, names);
    baselineDone = true;
    $log.hidden = true;
    Scene.refresh(true);
    RENDER[variant]();
    PROTO.status();
    PROTO.frame();
    $ppVar.textContent = `${variant} · ${VARIANTS.find(v => v.k === variant).name}`;
    $ppJson.textContent = statusJson(c);
    $ppCase.value = caseId;
    const p = new URLSearchParams(location.search);
    p.set("variant", variant); p.set("case", caseId);
    try { history.replaceState(null, "", "?" + p.toString()); } catch (e) {}
  }
  function stepVariant(d) {
    const i = VARIANTS.findIndex(v => v.k === variant);
    variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].k;
    apply();
  }
  $ppCase.innerHTML = Object.entries(CASES).map(([id, c]) => `<option value="${id}">${esc(c.label)}</option>`).join("");
  $ppCase.addEventListener("change", () => { caseId = $ppCase.value; $ppCase.blur(); apply(); });
  document.getElementById("ppPrev").addEventListener("click", () => stepVariant(-1));
  document.getElementById("ppNext").addEventListener("click", () => stepVariant(1));
  window.addEventListener("keydown", e => {
    if ((e.key !== "ArrowLeft" && e.key !== "ArrowRight") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;
    e.preventDefault(); e.stopPropagation();
    stepVariant(e.key === "ArrowRight" ? 1 : -1);
  }, true);

  /* ================= boot ================= */
  (async () => {
    await Scene.init();
    apply();
  })();
})();
</script>
</body></html>
